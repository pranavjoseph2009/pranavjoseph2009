<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="195" viewBox="0 0 1000 195" role="img" aria-label="Animated AI development pipeline: idea to design to code to launch">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b132a"/><stop offset="1" stop-color="#211843"/></linearGradient><linearGradient id="line"><stop stop-color="#52ddf7"/><stop offset="1" stop-color="#a999ff"/></linearGradient></defs>
<rect width="1000" height="195" rx="20" fill="url(#bg)" stroke="#34426b"/><text x="35" y="33" font-family="monospace" font-size="15" fill="#80e2f5" letter-spacing="2">THE BUILD LOOP</text>
<path d="M137 105H859" stroke="#2f406a" stroke-width="7" stroke-linecap="round"/><path d="M137 105H859" stroke="url(#line)" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 18"><animate attributeName="stroke-dashoffset" values="0;-112" dur="3s" repeatCount="indefinite"/></path>
<g fill="#151f3b" stroke="#8be4ff" stroke-width="3">
<circle cx="135" cy="105" r="34"><animate attributeName="stroke" values="#8be4ff;#cf9fff;#8be4ff" dur="4s" repeatCount="indefinite"/></circle>
<circle cx="375" cy="105" r="34"><animate attributeName="stroke" values="#cf9fff;#8be4ff;#cf9fff" dur="4s" repeatCount="indefinite"/></circle>
<circle cx="620" cy="105" r="34"><animate attributeName="stroke" values="#8be4ff;#cf9fff;#8be4ff" dur="4s" repeatCount="indefinite"/></circle>
<circle cx="860" cy="105" r="34"><animate attributeName="stroke" values="#cf9fff;#8be4ff;#cf9fff" dur="4s" repeatCount="indefinite"/></circle></g>
<g font-family="Arial,sans-serif" font-weight="bold" font-size="25" text-anchor="middle" fill="#e5faff"><text x="135" y="114">✦</text><text x="375" y="114">◇</text><text x="620" y="114">&lt;/&gt;</text><text x="860" y="114">↗</text></g>
<g font-family="Arial,sans-serif" font-size="15" fill="#b6c8e9" text-anchor="middle"><text x="135" y="164">IDEA</text><text x="375" y="164">DESIGN</text><text x="620" y="164">CODE</text><text x="860" y="164">SHIP</text></g>
<g><circle cx="135" cy="105" r="8" fill="#90f9ff"><animateMotion dur="8s" repeatCount="indefinite" path="M0 0 H725"/></circle></g>
</svg>