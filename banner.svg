<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Pranav MK — Developer, maker and creative technologist</title>
<desc id="desc">Midnight blue animated banner with a glowing orbital illustration and clean typography.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080F20"/><stop offset="0.6" stop-color="#101A36"/><stop offset="1" stop-color="#091222"/></linearGradient>
 <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#5EEAD4"/><stop offset="0.55" stop-color="#60A5FA"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#4F46E5" stop-opacity=".32"/><stop offset="1" stop-color="#4F46E5" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#8193B8" stroke-opacity=".075" stroke-width="1"/></pattern>
 <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
 .orbit{transform-origin:986px 178px;animation:spin 28s linear infinite}.orbit2{transform-origin:986px 178px;animation:spin 36s linear infinite reverse}
 .pulse{animation:pulse 3s ease-in-out infinite}.dash{stroke-dasharray:8 13;animation:dash 18s linear infinite}
 .enter{animation:enter 1.2s ease-out both}
 @keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.35}}@keyframes dash{to{stroke-dashoffset:-250}}@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
 @media (prefers-reduced-motion:reduce){.orbit,.orbit2,.pulse,.dash,.enter{animation:none}}
</style>
<rect width="1200" height="360" rx="20" fill="url(#bg)"/>
<rect width="1200" height="360" rx="20" fill="url(#grid)"/>
<circle cx="1004" cy="172" r="265" fill="url(#halo)"/>
<rect x="48" y="42" width="178" height="30" rx="15" fill="#142E3A" stroke="#215C64"/>
<circle class="pulse" cx="66" cy="57" r="5" fill="#5EEAD4"/>
<text x="80" y="62" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.8" fill="#91F5E6">OPEN TO BUILDING</text>
<g class="enter" font-family="Arial, Helvetica, sans-serif">
<text x="48" y="151" fill="#FFFFFF" font-size="66" font-weight="800" letter-spacing="-2.4">Pranav MK<tspan fill="#5EEAD4">.</tspan></text>
<text x="50" y="192" fill="#B8C8E3" font-size="21" font-weight="500">AI Developer  /  Automation Builder  /  Digital Marketer</text>
<rect x="50" y="222" width="355" height="3" rx="2" fill="url(#accent)"/>
<text x="50" y="265" fill="#DCE7F6" font-size="17">Building useful AI agents and thoughtful web experiences.</text>
<text x="50" y="300" fill="#8093B6" font-size="13" letter-spacing="1.8">BUILD • LEARN • SHIP • REPEAT</text>
</g>
<g fill="none" stroke="#6476A0" opacity=".55"><circle cx="986" cy="178" r="127"/><circle cx="986" cy="178" r="92"/><circle cx="986" cy="178" r="58"/></g>
<g class="orbit"><ellipse cx="986" cy="178" rx="157" ry="75" transform="rotate(-28 986 178)" fill="none" stroke="url(#accent)" stroke-width="2.6"/><circle cx="1143" cy="178" r="7" fill="#5EEAD4" filter="url(#glow)"/></g>
<g class="orbit2"><ellipse cx="986" cy="178" rx="154" ry="62" transform="rotate(49 986 178)" fill="none" stroke="#7C84FA" stroke-width="1.7" stroke-opacity=".72" stroke-dasharray="5 9"/><circle cx="832" cy="178" r="5" fill="#A78BFA"/></g>
<circle cx="986" cy="178" r="49" fill="#0E1E38" stroke="#64B5F6" stroke-width="2"/>
<circle cx="986" cy="178" r="37" fill="#13294B"/>
<text x="986" y="190" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="36" font-weight="700" fill="#8DE8DE">&lt;/&gt;</text>
<path d="M1172 28h-85M1172 28v36M28 332h105" stroke="#5EEAD4" stroke-opacity=".45" stroke-width="2"/>
</svg>